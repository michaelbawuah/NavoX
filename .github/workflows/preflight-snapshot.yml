name: Gmail runtime preflight

on:
  push:
    branches: [chore/spec003-preflight-20260924]
    paths: [.github/workflows/preflight-snapshot.yml]

permissions:
  contents: write

jobs:
  preflight:
    name: Verify exact Gmail migration checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: navox
          POSTGRES_PASSWORD: navox
          POSTGRES_DB: navox_gmail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U navox -d navox_gmail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bba81c776722d860966a45346956911482910e00
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - name: Apply the locally validated patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bba81c776722d860966a45346956911482910e00"
          archive="$RUNNER_TEMP/gmail-runtime.patch.xz"
          : > "$archive"
          for blob in bdfbcc4feb7ad507e4f96056eb77cdf962353bc1 154ee83e937e8f042f6ff758bb5ce5388fc88e5f e9021067de8cf2a962d33b0806702934324990c2; do
            gh api "repos/michaelbawuah/NavoX/git/blobs/$blob" --jq .content | base64 --decode > "$RUNNER_TEMP/patch-part"
            test "$(git hash-object "$RUNNER_TEMP/patch-part")" = "$blob"
            cat "$RUNNER_TEMP/patch-part" >> "$archive"
          done
          test "$(git hash-object "$archive")" = "2f10774c54f8f1911ea8d3c551c84e71002c9920"
          python3 -c 'import lzma,sys; sys.stdout.buffer.write(lzma.decompress(open(sys.argv[1], "rb").read()))' "$archive" > "$RUNNER_TEMP/gmail-runtime.patch"
          git apply --check --unidiff-zero "$RUNNER_TEMP/gmail-runtime.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/gmail-runtime.patch"
          test "$(git write-tree)" = "8be1ad7525048eb5c1dc073cbd904a3e19e2332d"
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          test -z "$(git diff --cached --name-only -- .github/workflows services/api/pyproject.toml services/api/uv.lock package-lock.json evals/gates.json services/api/migrations)"
          git diff --cached --stat
      - name: Run all API preflight gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-api.sh | tee "$RUNNER_TEMP/gmail-preflight.log"
          git diff --exit-code
          test "$(git write-tree)" = "8be1ad7525048eb5c1dc073cbd904a3e19e2332d"
      - name: Verify PostgreSQL schema
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://navox:navox@localhost:5432/navox_gmail
        run: uv run alembic upgrade head
      - name: Verify Gmail Calendar and recovery with PostgreSQL sessions
        working-directory: services/api
        env:
          NAVOX_CONNECTOR_TEST_DSN: postgresql+asyncpg://navox:navox@localhost:5432/navox_gmail
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/test_google_gmail_connector.py tests/test_google_calendar_connector.py tests/test_connector_sync_recovery.py --junitxml="$RUNNER_TEMP/google-runtime-pg.xml"
          python -c 'import sys,xml.etree.ElementTree as E; s=E.parse(sys.argv[1]).getroot(); a=list(s.iter("testsuite")); assert sum(int(x.get("tests",0)) for x in a)==121; assert all(int(x.get(k,0))==0 for x in a for k in ("failures","errors","skipped"))' "$RUNNER_TEMP/google-runtime-pg.xml"
      - name: Publish only the validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "8be1ad7525048eb5c1dc073cbd904a3e19e2332d"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(google): run resumable Gmail reads through the shared connector runtime'
          git push origin HEAD:refs/heads/chore/spec003-validated-google-gmail
          git rev-parse HEAD > "$RUNNER_TEMP/validated-candidate.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navox-gmail-runtime-preflight
          path: |
            ${{ runner.temp }}/gmail-preflight.log
            ${{ runner.temp }}/google-runtime-pg.xml
            ${{ runner.temp }}/validated-candidate.txt
          if-no-files-found: warn
          retention-days: 7
