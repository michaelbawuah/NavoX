name: SPEC-003 source snapshot

on:
  push:
    branches: [chore/spec003-preflight-20260924]
    paths: [.github/workflows/preflight-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    name: Prepare immutable source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bba81c776722d860966a45346956911482910e00
          persist-credentials: false
      - name: Archive tracked files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bba81c776722d860966a45346956911482910e00"
          git archive --format=tar.gz --output="$RUNNER_TEMP/navox-source-bba81c7.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/source-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: navox-source-bba81c7
          path: |
            ${{ runner.temp }}/navox-source-bba81c7.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-tree.txt
          if-no-files-found: error
          retention-days: 1
