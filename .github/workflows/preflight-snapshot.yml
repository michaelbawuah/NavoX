name: Preflight source snapshot

on:
  push:
    branches: [chore/spec003-preflight-20260924]
    paths: [.github/workflows/preflight-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    name: Prepare exact local development source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 383c06fc4869c39419ec54ba18afc25be0c7b240
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "383c06fc4869c39419ec54ba18afc25be0c7b240"
          git archive --format=zip --output="$RUNNER_TEMP/navox-runtime-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: navox-runtime-source-383c06f
          path: |
            ${{ runner.temp }}/navox-runtime-source.zip
            ${{ runner.temp }}/source-commit.txt
          if-no-files-found: error
          retention-days: 1
