name: SPEC-003 management source snapshot
on:
  push:
    branches: [chore/spec003-preflight-20260924]
    paths: [.github/workflows/preflight-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 28e0c022f819292db07bc5a74bdbfdffce1cee6d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact tracked source
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = '28e0c022f819292db07bc5a74bdbfdffce1cee6d'
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/navox-source-28e0c02.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: navox-source-28e0c02
          path: |
            ${{ runner.temp }}/navox-source-28e0c02.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-tree.txt
          retention-days: 1
      - run: npm ci
      - name: Archive locked web dependencies
        run: tar -czf "$RUNNER_TEMP/navox-web-env.tar.gz" node_modules apps/web/node_modules apps/extension/node_modules 2>/dev/null || test -s "$RUNNER_TEMP/navox-web-env.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: navox-web-env-28e0c02
          path: ${{ runner.temp }}/navox-web-env.tar.gz
          retention-days: 1
