name: SPEC-003 source snapshot

on:
  push:
    branches: [chore/spec003-preflight-20260924]
    paths: [.github/workflows/preflight-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    name: Prepare immutable current source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d99c59bd9ea39070c30c9fb29f130ea147c64fb7
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d99c59bd9ea39070c30c9fb29f130ea147c64fb7"
          git archive --format=tar.gz --output="$RUNNER_TEMP/navox-source-d99c59b.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: navox-source-d99c59b
          path: |
            ${{ runner.temp }}/navox-source-d99c59b.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-tree.txt
          if-no-files-found: error
          retention-days: 1
