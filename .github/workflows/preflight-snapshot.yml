name: Preflight source snapshot

on:
  push:
    branches: [chore/spec003-preflight-20260924]
    paths: [.github/workflows/preflight-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    name: Prepare locked local preflight environment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ba2fe13d01984a26f88e5b5462ff9eca0f9175b
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - name: Install the unchanged lockfile into a portable test environment
        shell: bash
        working-directory: services/api
        run: |
          set -euo pipefail
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/navox-preflight-env/python"
          uv python install 3.12
          uv sync --locked --all-groups --python 3.12 --managed-python
          mkdir -p "$RUNNER_TEMP/navox-preflight-env"
          cp -a .venv "$RUNNER_TEMP/navox-preflight-env/venv"
          uv pip freeze --python .venv/bin/python > "$RUNNER_TEMP/navox-preflight-env/installed.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/navox-preflight-env/source-commit.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/navox-preflight-env.tar.gz" navox-preflight-env
      - uses: actions/upload-artifact@v4
        with:
          name: navox-preflight-env-1ba2fe1
          path: ${{ runner.temp }}/navox-preflight-env.tar.gz
          if-no-files-found: error
          retention-days: 1
