name: Import and portability final preflight
on:
  push:
    branches: [chore/spec003-preflight-20260924]
    paths: [.github/workflows/preflight-snapshot.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env: {POSTGRES_USER: navox, POSTGRES_PASSWORD: navox, POSTGRES_DB: navox_imports}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U navox -d navox_imports"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: f5a14b6bd57b17fc31e7773bb0edb653de74a7c1, fetch-depth: 2}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.15', python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify exact candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f5a14b6bd57b17fc31e7773bb0edb653de74a7c1
          test "$(git rev-parse HEAD^)" = bf973b20cf7e62b3f4f91850ddd235fb3d9f4baa
          test "$(git rev-parse HEAD^{tree})" = 1fed4e5fe1ff8651bd581a1b9bbd7c993ee7c786
          git diff HEAD^ HEAD --check
          test -z "$(git diff HEAD^ HEAD --name-only -- .github/workflows services/api/pyproject.toml services/api/uv.lock package-lock.json evals/gates.json)"
      - name: Full API preflight
        run: |
          set -euo pipefail
          bash scripts/check-api.sh > "$RUNNER_TEMP/final-api.log" 2>&1 || { tail -160 "$RUNNER_TEMP/final-api.log"; exit 1; }
          grep -E 'passed|PASS:|Success:' "$RUNNER_TEMP/final-api.log"
      - name: Full pinned web gates
        run: |
          set -euo pipefail
          npm ci --silent
          for gate in lint typecheck test build; do
            npm run "$gate" > "$RUNNER_TEMP/final-web-$gate.log" 2>&1 || { tail -120 "$RUNNER_TEMP/final-web-$gate.log"; exit 1; }
            tail -8 "$RUNNER_TEMP/final-web-$gate.log"
          done
      - name: PostgreSQL migration round trip
        working-directory: services/api
        env: {DATABASE_URL: 'postgresql+asyncpg://navox:navox@localhost:5432/navox_imports'}
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic downgrade 0016_connector_sync_recovery
          uv run --no-sync alembic upgrade head
      - name: Real PostgreSQL import and unknown-service acceptance
        working-directory: services/api
        env: {NAVOX_CONNECTOR_TEST_DSN: 'postgresql+asyncpg://navox:navox@localhost:5432/navox_imports'}
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/test_managed_imports.py tests/test_connector_portability.py --junitxml="$RUNNER_TEMP/final-pg.xml" > "$RUNNER_TEMP/final-pg.log" 2>&1 || { tail -160 "$RUNNER_TEMP/final-pg.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/final-pg.log"
          python3 -c 'import sys,xml.etree.ElementTree as E; a=list(E.parse(sys.argv[1]).getroot().iter("testsuite")); assert sum(int(x.get("tests",0)) for x in a)==52; assert all(int(x.get(k,0))==0 for x in a for k in ("failures","errors","skipped"))' "$RUNNER_TEMP/final-pg.xml"
      - name: Verify candidate remained unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/final-candidate.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/final-tree.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navox-import-portability-final-preflight
          path: |
            ${{ runner.temp }}/final-*.log
            ${{ runner.temp }}/final-pg.xml
            ${{ runner.temp }}/final-candidate.txt
            ${{ runner.temp }}/final-tree.txt
          if-no-files-found: warn
          retention-days: 3
