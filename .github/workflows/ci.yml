name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  extension:
    name: Chrome extension quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=@navox/extension
      - run: npm run typecheck --workspace=@navox/extension
      - run: npm run test --workspace=@navox/extension
      - run: npm run build --workspace=@navox/extension
      - name: Verify Manifest V3 permission boundary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(
            fs.readFileSync("apps/extension/dist/manifest.json", "utf8"),
          );
          const expected = ["sidePanel", "storage"];
          if (manifest.manifest_version !== 3) throw new Error("Manifest V3 required");
          if (JSON.stringify(manifest.permissions) !== JSON.stringify(expected)) {
            throw new Error("Unexpected extension permissions");
          }
          if (!Array.isArray(manifest.host_permissions) || manifest.host_permissions.length !== 1) {
            throw new Error("Exactly one API host permission is required");
          }
          if (manifest.content_scripts) throw new Error("Content scripts are forbidden");
          NODE
      - name: Package extension artifact
        run: |
          cd apps/extension/dist
          zip -qr /tmp/navox-chrome-extension.zip .
          unzip -l /tmp/navox-chrome-extension.zip | grep -F manifest.json
          unzip -l /tmp/navox-chrome-extension.zip | grep -F service-worker.js
          unzip -l /tmp/navox-chrome-extension.zip | grep -F sidepanel.html

  api:
    name: API quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --locked --all-groups
        working-directory: services/api
      - run: uv run ruff check .
        working-directory: services/api
      - run: uv run ruff format --check .
        working-directory: services/api
      - run: uv run mypy navox
        working-directory: services/api
      - run: uv run pytest
        working-directory: services/api
      - run: uv run alembic upgrade head --sql > /tmp/navox-schema.sql
        working-directory: services/api
      - name: Verify required schema tables
        run: |
          for table in users workspaces workspace_memberships plans plan_steps actions approvals workflow_refs audit_events proactive_preferences proactive_signals briefing_snapshots people person_identities operational_observations observation_evidence intelligence_feedback intelligence_source_receipts; do
            grep -F "CREATE TABLE $table" /tmp/navox-schema.sql
          done
          grep -F "client_type" /tmp/navox-schema.sql
          grep -F "uq_person_identities_workspace_type_value" /tmp/navox-schema.sql
          grep -F "uq_observation_evidence_observation_source_hash" /tmp/navox-schema.sql

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: uv sync --locked --all-groups
        working-directory: services/api
      - run: uv run pip-audit --strict
        working-directory: services/api

  evaluation-hardening:
    name: Evaluation & hardening
    needs: [api]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --locked --all-groups
        working-directory: services/api
      - name: Run deterministic release evaluation
        run: |
          uv run python -m navox.evaluation \
            --fail-on-gate \
            --output /tmp/navox-evaluation.json \
            --markdown /tmp/navox-evaluation.md
        working-directory: services/api
      - name: Execute SPEC-002 acceptance and security regressions
        run: |
          uv run pytest tests/test_intelligence_*.py \
            --junitxml=/tmp/navox-spec002-tests.xml
        working-directory: services/api
      - name: Report executed SPEC-002 regression gates
        if: always()
        run: |
          uv run python -m navox.evaluation.intelligence_report \
            --junit /tmp/navox-spec002-tests.xml \
            --output /tmp/navox-spec002-regression.json
        working-directory: services/api
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navox-evaluation-report
          path: |
            /tmp/navox-evaluation.json
            /tmp/navox-evaluation.md
            /tmp/navox-spec002-tests.xml
            /tmp/navox-spec002-regression.json
          if-no-files-found: error
          retention-days: 30

  compose-integration:
    name: Compose integration
    needs: [web, extension, api, dependency-security, evaluation-hardening]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start Docker Compose
        run: |
          docker compose up --build -d || {
            docker compose ps
            docker compose logs
            exit 1
          }
      - name: Wait for NavoX readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8000/api/v1/health/ready >/dev/null \
              && curl --fail --silent --show-error http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Verify account and workspace lifecycle
        run: |
          curl --fail --silent --show-error \
            --cookie-jar /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data '{"email":"owner@example.com","password":"twelve-character-password","display_name":"Owner"}' \
            http://localhost:8000/api/v1/auth/register > /tmp/navox-account.json
          grep -F '"workspace_type":"personal"' /tmp/navox-account.json
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            http://localhost:8000/api/v1/auth/me > /tmp/navox-me.json
          grep -F '"email":"owner@example.com"' /tmp/navox-me.json
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data '{"request_id":"11111111-1111-4111-8111-111111111111","type":"task","title":"Verify Today loop","priority":5,"due_at":null}' \
            http://localhost:8000/api/v1/commitments > /tmp/navox-commitment.json
          grep -F '"title":"Verify Today loop"' /tmp/navox-commitment.json
          COMMITMENT_ID="$(python -c 'import json; print(json.load(open("/tmp/navox-commitment.json"))["id"])')"
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            'http://localhost:8000/api/v1/today?timezone=UTC' > /tmp/navox-today.json
          grep -F '"total":1' /tmp/navox-today.json
          grep -F '"title":"Verify Today loop"' /tmp/navox-today.json

          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data '{"email":"owner@example.com","password":"twelve-character-password"}' \
            http://localhost:8000/api/v1/auth/extension/login > /tmp/navox-extension-login.json
          EXTENSION_TOKEN="$(python -c 'import json; print(json.load(open("/tmp/navox-extension-login.json"))["access_token"])')"
          grep -F '"token_type":"bearer"' /tmp/navox-extension-login.json
          grep -F '"email":"owner@example.com"' /tmp/navox-extension-login.json
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $EXTENSION_TOKEN" \
            http://localhost:8000/api/v1/auth/me > /tmp/navox-extension-me.json
          grep -F '"email":"owner@example.com"' /tmp/navox-extension-me.json
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $EXTENSION_TOKEN" \
            'http://localhost:8000/api/v1/today?timezone=UTC' > /tmp/navox-extension-today.json
          grep -F '"title":"Verify Today loop"' /tmp/navox-extension-today.json
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data '{"query":"What do I need to know today?","timezone":"UTC"}' \
            http://localhost:8000/api/v1/today/query > /tmp/navox-query.json
          grep -F '"intent":"today"' /tmp/navox-query.json
          grep -F '"title":"Verify Today loop"' /tmp/navox-query.json
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data '{"request_id":"22222222-2222-4222-8222-222222222222","goal":"Safely prepare the next move"}' \
            "http://localhost:8000/api/v1/commitments/$COMMITMENT_ID/handle" > /tmp/navox-plan.json
          PLAN_ID="$(python -c 'import json; print(json.load(open("/tmp/navox-plan.json"))["id"])')"
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              --cookie /tmp/navox-session.cookie \
              "http://localhost:8000/api/v1/plans/$PLAN_ID" > /tmp/navox-plan-status.json
            PLAN_STATUS="$(python -c 'import json; print(json.load(open("/tmp/navox-plan-status.json"))["status"])')"
            if [ "$PLAN_STATUS" = "completed" ]; then
              break
            fi
            if [ "$PLAN_STATUS" = "blocked" ] || [ "$PLAN_STATUS" = "failed" ] || [ "$PLAN_STATUS" = "dispatch_failed" ]; then
              cat /tmp/navox-plan-status.json
              docker compose logs worker
              exit 1
            fi
            sleep 1
          done
          grep -F '"status":"completed"' /tmp/navox-plan-status.json
          grep -F '"risk_level":"R0"' /tmp/navox-plan-status.json
          grep -F '"risk_level":"R1"' /tmp/navox-plan-status.json
          grep -F '"external_actions_executed":false' /tmp/navox-plan-status.json

          USER_ID="$(python -c 'import json; print(json.load(open("/tmp/navox-account.json"))["id"])')"
          WORKSPACE_ID="$(python -c 'import json; print(json.load(open("/tmp/navox-account.json"))["workspace"]["id"])')"
          CONNECTION_ID="33333333-3333-4333-8333-333333333333"
          docker compose exec -T postgres psql -U navox -d navox -v ON_ERROR_STOP=1 -c             "INSERT INTO connections (id,user_id,workspace_id,provider,external_account_id,external_email,status,granted_scopes,created_at,updated_at) VALUES ('$CONNECTION_ID','$USER_ID','$WORKSPACE_ID','google','ci-google','owner@example.com','active','[\"openid\",\"https://www.googleapis.com/auth/gmail.send\"]',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);"

          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data "{\"request_id\":\"44444444-4444-4444-8444-444444444444\",\"connection_id\":\"$CONNECTION_ID\",\"to\":\"recipient@example.com\",\"subject\":\"CI exact approval\",\"body_text\":\"Prepared but never sent in CI.\",\"post_send_state\":\"unchanged\"}" \
            "http://localhost:8000/api/v1/commitments/$COMMITMENT_ID/actions/gmail-send/prepare" > /tmp/navox-action.json
          ACTION_ID="$(python -c 'import json; print(json.load(open("/tmp/navox-action.json"))["id"])')"
          grep -F '"risk_level":"R3"' /tmp/navox-action.json
          grep -F '"status":"awaiting_approval"' /tmp/navox-action.json
          grep -F '"approval":{"id":' /tmp/navox-action.json

          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data '{"request_id":"55555555-5555-4555-8555-555555555555"}' \
            "http://localhost:8000/api/v1/actions/$ACTION_ID/reject" > /tmp/navox-rejected-action.json
          grep -F '"status":"rejected"' /tmp/navox-rejected-action.json
          for attempt in $(seq 1 15); do
            curl --fail --silent --show-error \
              --cookie /tmp/navox-session.cookie \
              "http://localhost:8000/api/v1/actions/$ACTION_ID" > /tmp/navox-action-after.json
            WORKFLOW_STATUS="$(python -c 'import json; print(json.load(open("/tmp/navox-action-after.json"))["workflow_status"])')"
            if [ "$WORKFLOW_STATUS" = "rejected" ]; then
              break
            fi
            sleep 1
          done
          grep -F '"workflow_status":"rejected"' /tmp/navox-action-after.json

          DEADLINE_DUE="$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) + timedelta(hours=2)).isoformat())')"
          MEETING_DUE="$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) + timedelta(minutes=90)).isoformat())')"
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data "{\"request_id\":\"66666666-6666-4666-8666-666666666666\",\"type\":\"deadline\",\"title\":\"Milestone 7 CI deadline\",\"priority\":5,\"due_at\":\"$DEADLINE_DUE\"}" \
            http://localhost:8000/api/v1/commitments > /tmp/navox-proactive-deadline.json
          DEADLINE_ID="$(python -c 'import json; print(json.load(open("/tmp/navox-proactive-deadline.json"))["id"])')"
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data "{\"request_id\":\"77777777-7777-4777-8777-777777777777\",\"type\":\"meeting\",\"title\":\"Milestone 7 CI review\",\"description\":\"Review proactive workflow state.\",\"priority\":4,\"due_at\":\"$MEETING_DUE\"}" \
            http://localhost:8000/api/v1/commitments > /tmp/navox-proactive-meeting.json
          MEETING_ID="$(python -c 'import json; print(json.load(open("/tmp/navox-proactive-meeting.json"))["id"])')"

          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data '{"timezone":"UTC","notifications_enabled":true,"quiet_hours_start":"22:00","quiet_hours_end":"07:00","daily_briefing_hour":8,"notify_threshold":85,"briefing_threshold":65,"dashboard_threshold":40,"max_interruptions_per_day":3,"cooldown_minutes":240}' \
            http://localhost:8000/api/v1/proactive/preferences > /tmp/navox-proactive-preferences.json
          grep -F '"timezone":"UTC"' /tmp/navox-proactive-preferences.json

          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --request POST \
            http://localhost:8000/api/v1/proactive/activate > /tmp/navox-proactive-activation.json
          grep -F '"workflow_type":"daily_briefing"' /tmp/navox-proactive-activation.json
          grep -F '"workflow_type":"commitment_lifecycle"' /tmp/navox-proactive-activation.json
          grep -F '"workflow_type":"meeting_preparation"' /tmp/navox-proactive-activation.json
          grep -F '"status":"running"' /tmp/navox-proactive-activation.json

          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            'http://localhost:8000/api/v1/proactive/briefing?timezone=UTC' > /tmp/navox-proactive-briefing.json
          grep -F '"signal_type":"deadline_warning"' /tmp/navox-proactive-briefing.json
          grep -F '"signal_type":"meeting_prep"' /tmp/navox-proactive-briefing.json
          grep -F '"what_happening":' /tmp/navox-proactive-briefing.json
          grep -F '"why_matters":' /tmp/navox-proactive-briefing.json

          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            http://localhost:8000/api/v1/proactive/meeting-prep > /tmp/navox-meeting-prep.json
          grep -F '"title":"Milestone 7 CI review"' /tmp/navox-meeting-prep.json
          grep -F '"prep_points":' /tmp/navox-meeting-prep.json

          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data '{"query":"What am I forgetting?","timezone":"UTC"}' \
            http://localhost:8000/api/v1/today/query > /tmp/navox-forgetting.json
          grep -F '"intent":"forgetting"' /tmp/navox-forgetting.json
          grep -F '"title":"Milestone 7 CI deadline"' /tmp/navox-forgetting.json

          SIGNAL_ID="$(python -c 'import json; b=json.load(open("/tmp/navox-proactive-briefing.json")); print((b["notify_now"]+b["briefing"]+b["dashboard"])[0]["id"])')"
          SNOOZE_UNTIL="$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) + timedelta(hours=4)).isoformat())')"
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --header "Content-Type: application/json" \
            --data "{\"until\":\"$SNOOZE_UNTIL\"}" \
            "http://localhost:8000/api/v1/proactive/signals/$SIGNAL_ID/snooze" > /tmp/navox-proactive-snooze.json
          grep -F '"tier":"suppressed"' /tmp/navox-proactive-snooze.json

          test "$(docker compose exec -T postgres psql -U navox -d navox -Atc "SELECT count(*) FROM actions WHERE commitment_id IN ('$DEADLINE_ID','$MEETING_ID');")" = "0"

          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --request POST \
            "http://localhost:8000/api/v1/commitments/$DEADLINE_ID/complete" >/dev/null
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --request POST \
            "http://localhost:8000/api/v1/commitments/$MEETING_ID/complete" >/dev/null
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --request POST \
            "http://localhost:8000/api/v1/commitments/$COMMITMENT_ID/complete" > /tmp/navox-complete.json
          grep -F '"status":"completed"' /tmp/navox-complete.json
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            'http://localhost:8000/api/v1/today?timezone=UTC' > /tmp/navox-today-after.json
          grep -F '"total":0' /tmp/navox-today-after.json
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --cookie /tmp/navox-session.cookie \
            http://localhost:8000/api/v1/connections/google/start)" = "503"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $EXTENSION_TOKEN" \
            --request POST \
            http://localhost:8000/api/v1/auth/extension/logout > /tmp/navox-extension-logout.json
          grep -F '"status":"signed_out"' /tmp/navox-extension-logout.json
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $EXTENSION_TOKEN" \
            http://localhost:8000/api/v1/auth/me)" = "401"
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            http://localhost:8000/api/v1/auth/me > /tmp/navox-web-session-still-valid.json
          grep -F '"email":"owner@example.com"' /tmp/navox-web-session-still-valid.json
          curl --fail --silent --show-error \
            --cookie /tmp/navox-session.cookie \
            --request POST \
            http://localhost:8000/api/v1/auth/logout
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --cookie /tmp/navox-session.cookie http://localhost:8000/api/v1/auth/me)" = "401"
      - name: Verify SPEC-002 through Temporal and PostgreSQL with provider fixtures
        run: |
          docker compose run --rm --no-deps -T \
            --volume "$PWD/services/api/integration:/app/integration:ro" \
            api uv run --no-sync python -m integration.intelligence_temporal_smoke
      - name: Capture service diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 api worker postgres
      - if: always()
        run: docker compose down --volumes --remove-orphans
